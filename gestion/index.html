<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Coswars · gestion</title>
<link rel="icon" href="logo.png">
<style>
  /* Couleurs du jeu : bleu nuit, jaune Coswars, violet des cristaux, vert de la puissance, encre noire épaisse (façon Borderlands) */
  :root{--bg:#0b0624;--bg2:#140d33;--card:#1b1442;--card2:#271d57;--line:#3a2f78;--ink:#000;--txt:#f5f2ff;--sub:#c3bbe8;
    --y:#ffd23f;--cr:#c18bff;--pw:#7dff3a;--c:#35e0ff;--p:#ff5c8f;--ok:#7dff6a;--apple:#eef0f6;--google:#3ddc84;--stripe:#8a84ff}
  *{box-sizing:border-box}[hidden]{display:none!important}html{background:var(--bg)}
  body{margin:0;background:radial-gradient(1200px 700px at 50% -10%,#24185c 0,var(--bg) 60%) fixed;color:var(--txt);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
  a{color:var(--c)}:focus-visible{outline:3px solid var(--y);outline-offset:2px}
  .sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
  header{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:8px 16px;background:rgba(20,13,51,.96);border-bottom:4px solid var(--ink)}
  .home{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--y);font-weight:900;letter-spacing:.6px;font-size:18px}
  .home img{width:40px;height:40px;border-radius:11px;border:3px solid var(--ink);box-shadow:3px 3px 0 var(--ink)}
  nav.top{display:flex;gap:5px;flex-wrap:wrap}
  nav.top a{position:relative}
  nav.top a .nbadge{position:absolute;top:-9px;right:-9px;min-width:20px;height:20px;line-height:16px;padding:0 5px;border-radius:10px;background:#e5172f;color:#fff;font-size:12px;font-weight:800;text-align:center;border:2px solid var(--ink);box-shadow:1px 1px 0 var(--ink);pointer-events:none}
  nav.top a .rbadge{display:none!important}
  nav.top a{color:var(--txt);text-decoration:none;background:var(--card);border:2px solid var(--ink);border-radius:9px;padding:5px 10px;font-weight:700;font-size:13px;box-shadow:2px 2px 0 var(--ink)}
  nav.top a[aria-current=page]{background:var(--y);color:var(--ink)}
  header .who{margin-left:auto;color:var(--sub);font-size:13px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
  main{padding:18px 16px 60px;max-width:1500px;margin:0 auto}
  h1.page{margin:4px 0 14px;font-size:26px;color:var(--y);text-shadow:3px 3px 0 var(--ink)}
  .cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(175px,1fr));gap:12px;margin-bottom:18px}
  .card{background:var(--card);border:3px solid var(--ink);border-radius:14px;padding:11px 14px;box-shadow:4px 4px 0 var(--ink)}
  .card .v{font-size:25px;font-weight:900;color:var(--y);line-height:1.15}.card .l{color:var(--sub);font-size:13px}.card .s{font-size:12px;color:var(--sub)}
  .card.ok .v{color:var(--ok)}.warnc{color:#ffb84d}
  button.card.dk{cursor:pointer;text-align:left;font:inherit;color:inherit}button.card.dk:hover{filter:brightness(1.18)}button.card.dk.open{outline:3px solid var(--y)}.card .dkh{opacity:.75}.drill{border:3px solid var(--y)}
  .subtabs{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 12px}.subtabs a{padding:7px 14px;border:3px solid var(--ink);border-radius:10px;background:var(--card);color:var(--fg,#fff);text-decoration:none;font-weight:700;cursor:pointer;box-shadow:3px 3px 0 var(--ink)}
  .subtabs a[aria-current]{background:#3a2f78;color:var(--y)}
  .dstep{display:flex;gap:7px;align-items:flex-start;line-height:1.25}.dstep b{min-width:16px;text-align:center}.dstep small{display:block;color:var(--sub);font-size:11px}
  .dstep.ok b{color:var(--ok)}.dstep.ko b,.dstep.ko{color:var(--p)}.dstep.cours b{color:#ffb84d}
  button.mini{padding:2px 8px;font-size:12px}
  .search{display:flex;gap:10px;align-items:center;flex-wrap:wrap;background:var(--card);border:3px solid var(--ink);border-radius:14px;padding:12px 14px;box-shadow:4px 4px 0 var(--ink);margin:0 0 14px}
  .search input{flex:1;min-width:260px;font-size:18px;padding:10px 12px}.search .hits{flex-basis:100%;display:flex;flex-wrap:wrap;gap:8px}
  .search .hit{display:flex;gap:8px;align-items:center;padding:7px 11px;border:2px solid var(--ink);border-radius:10px;background:#221a52;color:inherit;text-decoration:none;cursor:pointer}.search .hit:hover{background:#3a2f78}
  .card.cr .v{color:var(--cr)}.card.pw .v{color:var(--pw)}.card.mo .v{color:var(--ok)}.card.ko .v{color:var(--p)}
  .box{background:var(--card);border:3px solid var(--ink);border-radius:14px;padding:14px;margin-bottom:16px;box-shadow:4px 4px 0 var(--ink);overflow:auto}
  .box h2{margin:0 0 10px;font-size:17px;color:var(--c)}.box h3{margin:12px 0 6px;font-size:14px;color:var(--y)}

  table{border-collapse:collapse;width:100%;font-size:13px}th,td{padding:6px 8px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
  td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
  th{color:var(--sub);font-weight:700;position:sticky;top:0;background:var(--card);z-index:1}
  th button{all:unset;cursor:pointer;color:var(--sub);font-weight:700}th button:hover{color:var(--txt)}th[aria-sort] button{color:var(--y)}
  tr.click{cursor:pointer}tr.click:hover,tr.click:focus-within{background:var(--card2)}
  input,select{background:#0f0a2a;color:var(--txt);border:2px solid var(--line);border-radius:9px;padding:8px 10px;font:inherit}
  button.act,a.act{display:inline-block;background:var(--y);color:var(--ink);border:3px solid var(--ink);border-radius:10px;padding:7px 14px;font-weight:800;cursor:pointer;text-decoration:none;box-shadow:3px 3px 0 var(--ink);font:inherit;font-weight:800}
  button.sec,a.sec{background:var(--card2);color:var(--txt)}button.act:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink)}
  .row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
  .grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(360px,100%),1fr));gap:16px}
  .grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(280px,100%),1fr));gap:16px}
  .muted{color:var(--sub)}.ok{color:var(--ok)}.ko{color:var(--p)}.cry{color:var(--cr)}.pow{color:var(--pw)}
  .tag{display:inline-block;padding:1px 7px;border-radius:7px;background:#3a2f78;font-size:12px;margin:1px 3px 1px 0}
  tr.pgood td{background:rgba(34,160,90,.20)}tr.pgood td:first-child{box-shadow:inset 5px 0 0 #2fc46b}tr.pbad td{background:rgba(200,30,50,.20)}tr.pbad td:first-child{box-shadow:inset 5px 0 0 #e5394f}
  .flag{font-size:20px;margin-right:6px;vertical-align:-2px}.flag.g{opacity:.65}
  .tag.test{background:#5b4a00;color:#ffe9a0}.tag.ref{background:#6b1030;color:#ffd0dd}.tag.adm{background:#00485a;color:#bff4ff}.tag.abo{background:#0b5a2a;color:#c9ffd9;font-weight:700}.tag.uniq{background:#33305a;color:#e2dfff}
  .st{display:inline-flex;align-items:center;gap:5px;padding:1px 8px 1px 6px;border-radius:999px;font-size:12px;font-weight:700;border:2px solid var(--ink);color:var(--ink)}
  .st::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--ink)}
  .st.apple{background:var(--apple)}.st.google{background:var(--google)}.st.stripe{background:var(--stripe)}.st.autre{background:#999}
  .dot{display:inline-block;width:10px;height:10px;border-radius:50%;background:#4a4170;border:2px solid var(--ink)}.dot.on{background:var(--ok);box-shadow:0 0 8px var(--ok)}
  #login{max-width:400px;margin:70px auto}#login .box{display:grid;gap:10px}#login img{width:96px;margin:0 auto;border-radius:22px;border:4px solid var(--ink);box-shadow:5px 5px 0 var(--ink)}
  pre{white-space:pre-wrap;word-break:break-word;font-size:12px;color:var(--sub);max-height:420px;overflow:auto}
  details summary{cursor:pointer;color:var(--c);font-weight:700}
  .bars{display:flex;align-items:flex-end;gap:3px;height:120px}.bars div{flex:1;background:var(--c);border-radius:3px 3px 0 0;min-height:2px;position:relative;border:1px solid var(--ink)}

  .hb{display:grid;grid-template-columns:minmax(110px,auto) 1fr auto;gap:6px 10px;align-items:center;font-size:13px}
  .hb .t{height:14px;background:#0f0a2a;border:2px solid var(--ink);border-radius:7px;overflow:hidden}.hb .t i{display:block;height:100%;background:var(--c)}
  .split{display:flex;height:22px;border:3px solid var(--ink);border-radius:9px;overflow:hidden;margin:6px 0 10px}.split i{display:block;height:100%}
  #sndBlock{position:fixed;left:50%;transform:translateX(-50%);bottom:16px;z-index:9;background:#7a0f1a;color:#fff;border:3px solid var(--ink);border-radius:12px;padding:10px 16px;font-weight:800;font-size:15px;box-shadow:4px 4px 0 var(--ink);cursor:pointer;max-width:92vw;text-align:center}
  #notifN{margin-left:6px;background:#e5172f;color:#fff;border-radius:12px;padding:0 8px;font-size:14px;min-width:22px;display:inline-block;text-align:center;box-shadow:0 0 0 2px var(--ink)}
  #notifPanel{position:fixed;top:70px;right:16px;z-index:20;width:min(460px,calc(100vw - 32px));max-height:calc(100vh - 100px);overflow:auto;background:#1b1442;color:#fff;border:3px solid var(--ink);border-radius:14px;box-shadow:6px 6px 0 var(--ink);padding:12px}
  #notifPanel a.nt{display:flex;gap:10px;align-items:flex-start;color:inherit;text-decoration:none;border-top:2px solid #3a2f78;padding:9px 6px}
  #notifPanel a.nt.new{background:#2c2170}#notifPanel a.nt:hover{background:#352a85}
  #notifPanel .nf{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 8px}#notifPanel .nf button{cursor:pointer}
  #payToast{position:fixed;top:74px;right:20px;z-index:9;background:var(--ok);color:var(--ink);border:3px solid var(--ink);border-radius:14px;padding:14px 18px;font-weight:800;font-size:17px;box-shadow:6px 6px 0 var(--ink);max-width:440px}
  .room{border:2px solid var(--line);border-radius:12px;padding:10px;margin-bottom:10px}
  .net{display:block;font-size:11px;font-weight:700;color:var(--ok);line-height:1.3}.net.big{font-size:13px}.kpi .net.big{font-size:12px}
  /* Parties en direct (mode dieu) : carte vue de dessus */
  .god{display:grid;grid-template-columns:minmax(0,1fr) minmax(280px,380px);gap:16px}@media (max-width:980px){.god{grid-template-columns:1fr}}
  .god canvas{width:100%;aspect-ratio:1/1;max-height:calc(100vh - 170px);background:#07041a;border:3px solid var(--ink);border-radius:14px;box-shadow:4px 4px 0 var(--ink);display:block}
  .lg{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--sub);margin-top:8px}.lg i{display:inline-block;width:11px;height:11px;border-radius:50%;border:2px solid var(--ink);vertical-align:-1px;margin-right:4px}
  .lifebar{display:inline-flex;width:90px;height:9px;border:2px solid var(--ink);border-radius:5px;overflow:hidden;background:#0f0a2a;vertical-align:middle}.lifebar i{display:block;height:100%}
  .warn{background:#3d2a00;border:3px solid var(--ink);border-radius:12px;padding:9px 12px;margin-bottom:14px;color:#ffe9a0;font-size:13px;box-shadow:3px 3px 0 var(--ink)}

  /* ---- Cadran d'accueil : logo au centre, anneau des chiffres clés, cercle des sections ---- */
  .dial{--S:clamp(720px,min(94vw,calc(100vh - 80px)),920px);position:relative;width:var(--S);height:var(--S);margin:0 auto 26px}
  .dial .ring{position:absolute;left:50%;top:50%;border-radius:50%;transform:translate(-50%,-50%);pointer-events:none}
  .dial .r1{width:calc(var(--S)*.66);height:calc(var(--S)*.66);border:4px solid var(--ink);box-shadow:0 0 0 3px #2b2166 inset,0 0 60px #35e0ff22;background:radial-gradient(circle,#1d1450 0,#140d33 70%)}
  .dial .r2{width:calc(var(--S)*.97);height:calc(var(--S)*.97);border:3px dashed #3a2f78}
  .dial .r0{width:calc(var(--S)*.22);height:calc(var(--S)*.22);border:4px solid var(--ink);background:#0b0624;box-shadow:0 0 0 6px var(--y),0 0 0 10px var(--ink),0 0 50px #ffd23f55}
  .dial .logo{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:calc(var(--S)*.175);text-align:center;text-decoration:none}
  .dial .logo img{width:100%;border-radius:24%;display:block}
  .dial .logo b{display:block;position:absolute;left:50%;top:calc(100% + 18px);transform:translateX(-50%);color:var(--y);font-size:15px;letter-spacing:3px;text-shadow:2px 2px 0 var(--ink);white-space:nowrap}
  .dial .it{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%) rotate(var(--a)) translate(var(--r)) rotate(calc(-1*var(--a)))}
  .kpi{--r:calc(var(--S)*.225);width:calc(var(--S)*.155);text-align:center;background:var(--card);border:3px solid var(--ink);border-radius:16px;padding:8px 6px;box-shadow:4px 4px 0 var(--ink)}
  .kpi .v{font-size:21px;font-weight:900;line-height:1.1;color:var(--y);font-variant-numeric:tabular-nums}.kpi .l{font-size:12px;color:var(--sub);line-height:1.25}.kpi .s{font-size:11px;color:var(--sub)}
  .kpi.mo .v{color:var(--ok)}.kpi.on .v{color:var(--c)}.kpi.nw .v{color:var(--pw)}
  .osec{--r:calc(var(--S)*.405)}
  a.dbtn{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;width:calc(var(--S)*.15);min-height:96px;padding:8px 6px;text-align:center;text-decoration:none;color:var(--txt);
    background:var(--card2);border:3px solid var(--ink);border-radius:50%/40%;box-shadow:4px 4px 0 var(--ink);transition:transform .12s,background .12s;position:relative}
  a.dbtn:hover,a.dbtn:focus-visible{background:var(--y);color:var(--ink)}a.dbtn:hover .m,a.dbtn:focus-visible .m{color:#3a2a00}
  a.dbtn .i{font-size:26px;line-height:1}a.dbtn .t{font-weight:900;font-size:14px;line-height:1.15}a.dbtn .m{font-size:11px;color:var(--sub)}
  a.dbtn .badge{position:absolute;top:-6px;right:4px;background:var(--p);color:#fff;border:2px solid var(--ink);border-radius:999px;min-width:24px;padding:0 6px;font-weight:900;font-size:13px}
  .dial .live{position:absolute;left:50%;bottom:calc(var(--S)*.205);transform:translateX(-50%);font-size:11px;color:var(--sub);white-space:nowrap}
  @media (max-width:760px){
    .dial{width:auto;height:auto;display:grid;gap:12px}
    .dial .ring,.dial .live{display:none}.dial .logo{position:relative;left:auto;top:auto;transform:none;width:110px;margin:6px auto 30px}
    .dial .it{position:relative;left:auto;top:auto;transform:none}.dial .kgrid,.dial .sgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}
    .kpi{width:auto}a.dbtn{width:auto;border-radius:16px;min-height:84px}
  }
  @media (min-width:761px){.dial .kgrid,.dial .sgrid{display:contents}}
</style>
</head>
<body>
<header>
  <a class="home" href="#/comptes" title="Revenir aux comptes"><img src="logo.png" alt=""><span>COSWARS · gestion</span></a>
  <nav class="top" id="tabs" aria-label="Sections" hidden></nav>
  <span class="who" id="who"><button class="act sec" id="notifBtn" hidden aria-haspopup="true" aria-expanded="false" title="Ce qui s’est passé depuis votre dernier coup d’œil">🔔 Notifications <b id="notifN" hidden></b></button><button class="act sec" id="sonPay" hidden title="Son joué à chaque nouveau paiement">🔔 Son des paiements</button><button class="act sec" id="sonRet" hidden title="Alerte (son, bandeau, notification) à chaque retour qui mérite votre attention">🔔 Alertes des retours</button><button class="act sec" id="sonAcc" hidden title="Son joué à chaque nouveau compte créé">🔔 Son des nouveaux comptes</button><span id="whoTxt"></span></span>
</header>
<div id="notifPanel" role="dialog" aria-label="Notifications" hidden></div>
<div id="payToast" role="status" aria-live="polite" hidden></div>
<div id="sndBlock" role="status" hidden>🔇 Le navigateur bloque les sons du back (paiements, nouveaux comptes, alertes) : cliquez n’importe où dans la page pour les autoriser.</div>
<main>
  <div id="login"><div class="box">
    <img src="logo.png" alt="Logo de Coswars">
    <h1 style="margin:0;color:var(--y);text-align:center">Connexion administrateur</h1>
    <p class="muted" id="srv"></p>
    <label class="sr" for="em">Adresse e-mail</label><input id="em" type="email" placeholder="Adresse e-mail du compte administrateur" autocomplete="username">
    <label class="sr" for="pw">Mot de passe</label><input id="pw" type="password" placeholder="Mot de passe" autocomplete="current-password">
    <button class="act" id="go">Se connecter</button>
    <button class="act sec" id="new">Première connexion : créer le compte</button>
    <p class="ko" id="err" role="alert"></p>
    <p class="muted">Seuls les comptes déclarés administrateur entrent (table <code>admins</code>, voir LISEZMOI.md).</p>
  </div></div>
  <div id="view" aria-live="polite"></div>
</main>
<script>
const CARD_EUR = {hebdo: 0.99, mois: 3.99, hebdo2: 4.99, mois2: 14.99, cmd: 49.99, vip7: 9.99, vip30: 29.99}, CARD_NM = {hebdo: 'ancienne carte hebdomadaire', mois: 'ancienne carte mensuelle', hebdo2: 'carte hebdomadaire', mois2: 'carte mensuelle', cmd: 'carte Commandant', vip7: 'VIP 7 jours', vip30: 'VIP 30 jours'};

// Back de gestion de Coswars (2e version, 03/11 ; depuis le 19/11, la page d'accueil est « Comptes », plus de cadran) :
// les comptes, les parties, les cristaux, les ventes par magasin (Apple, Google Play, Stripe) et par devise, l'audience,
// les alertes, la boutique, les armes et le jeu en ligne en direct.
// Il lit la base Supabase du jeu par les fonctions admin_* (supabase/migrations), réservées aux comptes de la table admins :
// aucune clé secrète ici, seulement la clé publique du projet et votre connexion d'administrateur. Les fonctions de la
// migration 20261103150000_back_v2.sql (admin_dashboard, admin_accounts, admin_purchases) sont utilisées si elles existent ;
// sinon la page retombe sur les anciennes (admin_overview, admin_players, admin_sales).
// ?essai dans l'adresse : faux Supabase local (node tools/faux-supabase.mjs 54321 demo), pour essayer sans toucher au vrai serveur.
const ESSAI = location.search.includes('essai');
const CFG = ESSAI ? {url: 'http://127.0.0.1:' + (+new URLSearchParams(location.search).get('essai') || 54321), key: 'cle-publique'} : {url: 'https://wnsvuzndmcfywbkzrbob.supabase.co', key: 'sb_publishable_BlpLjTWM8D8OQQlkueVW5g_92vJdL7Y'};
const NET_JSON = location.hostname === 'coswars.com' ? '/jeu/net.json' : location.protocol.startsWith('http') && !ESSAI ? '../net.json' : 'https://guillaumerouretravail-creator.github.io/coswars/net.json';
const $ = s => document.querySelector(s), esc = v => String(v ?? '').replace(/[&<>"]/g, c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;'}[c]));
const SP = {terrien: 'Terrien', venusien: 'Vénusien', draco: 'Draco', mentis: 'Mentis', arcturien: 'Arcturien'};
// modes enregistrés dans games.mode (src/engine : baseMatch({mode})) ; les trois derniers ne sont plus au menu
const MODES = {tourelle: 'Zone défensive', coal: 'Commando', evasion: 'Évasion', pred: 'Tireur d’élite (sniper)', predA: 'Tireur d’élite (assassin)',
  commander: 'Commandeur', tb: 'Bataille par équipe', arene: 'Arène des titans', surv: 'Tournoi des As (survie)', champ: 'Tournoi des As (championnat)'};
const OLD_MODES = {team: 'Bataille (ancienne)', duel: 'Duel de boss (ancien)', siege: 'Siège des titans (ancien)'};
const modeName = m => MODES[m] || OLD_MODES[m] || m;
// raisons réellement inscrites au registre des cristaux (fonctions des migrations)
const REASONS = {achat: 'Achat (pack payé)', carte: 'Carte (cristaux du jour)', remboursement: 'Remboursement', jeu: 'Jeu (gain ou dépense)', arme: 'Achat d’arme', parrainage: 'Parrainage', pseudo: 'Changement de pseudo', admin: 'Administrateur'};
const PLAT = {iphone: 'App iPhone', android: 'App Android', web: 'Navigateur (ordinateur)', telephone: 'Navigateur (téléphone)', mac: 'App Mac', windows: 'App Windows', '?': 'Inconnue'};

  const g = ESSAI ? (localStorage.getItem('coswars.jeuEssai') || 'http://localhost:8765/index.html') : (location.hostname === 'coswars.com' ? location.origin + '/jeu/' : new URL('../', location.href).href);   // 18/11 : sur coswars.com, le jeu est dans /jeu/
  window.open(g + '#regard=' + encodeURIComponent(b), '_blank') }

function godDraw(G, code) { const s = G.s, cv = $('#gC'); if (!cv) return;
  $('#gS').innerHTML = G.err ? `<span class="ko">${esc(G.err)}</span>` : `actualisé à ${new Date().toLocaleTimeString('fr-FR')}`;
  if (!s) return; const P = s.players || [], E = s.ents || [];

async function payCheck() {

    if (!fresh.length) return;
    const good = fresh.filter(payGood), bad = fresh.filter(x => !payGood(x)), t = $('#payToast'), lab = x => `${x.pseudo || 'joueur'}${x.num ? ' · ' + x.num : ''} · ${x.product_name || x.product.replace('fr.coswars.jeu.', '')} · ${STN[STORE(x.store)]}`;
    if (good.length) { payPlay(); const x = good[0];
      t.innerHTML = `💶 Nouveau paiement${good.length > 1 ? ` (${good.length})` : ''} : ${payFlag(x)}${esc(lab(x))} · ${x.price != null ? esc(fmtCur(x.price, curOf(x)) + (curOf(x) !== 'EUR' ? ` (≈ ${eur(toEur(x.price, curOf(x)))})` : '') + ` · net ${eur(eurRow(x).n)}`) : ''}`; t.style.background = '' }
    else { const x = bad[0]; t.innerHTML = `🔻 ${esc(EV[x.event] || x.event)}${bad.length > 1 ? ` (${bad.length})` : ''} : ${payFlag(x)}${esc(lab(x))}`; t.style.background = '#f06272' }
    t.hidden = false; clearTimeout(payCheck.h); payCheck.h = setTimeout(() => { t.hidden = true; t.style.background = '' }, 12000);
    delete C.pur; delete C.acc; delete C.dash; if (/^(ventes|livraisons|comptes|fiche|plateformes)$/.test(page)) liveTick(true) } catch (e) {} }
// Son des nouveaux comptes (06/11) : toutes les 20 s, la date de création du dernier compte ; à chaque compte créé depuis le
// dernier passage, le son son/nouveau-compte.mp4 (fichier fourni par l'utilisateur ; à défaut, deux bips) et un bandeau.
// Le premier passage ne fait que relever le dernier compte connu (gardé sur cet ordinateur).
const ACC_KEY = 'coswars.dernierCompte' + (ESSAI ? '.essai' : ''), accSnd = new Audio('son/nouveau-compte.mp4'); let accT = 0, accOn = localStorage.getItem('coswars.sonComptes') !== '0';
const accBeep = () => { payBeep(); setTimeout(payBeep, 220) };
function accPlay() { if (!accOn) return; accSnd.currentTime = 0; accSnd.play().catch(() => { sndBlocked(); accBeep() }) }
function accLabel() { $('#sonAcc').textContent = accOn ? '🔔 Son des nouveaux comptes' : '🔕 Nouveaux comptes : son coupé'; $('#sonAcc').setAttribute('aria-pressed', accOn) }
$('#sonAcc').onclick = () => { accOn = !accOn; localStorage.setItem('coswars.sonComptes', accOn ? '1' : '0'); accLabel(); if (accOn) accPlay() };
async function accCheck() {
  try { let L; try { L = await rpc('admin_accounts', {p_search: '', p_limit: 10000}) } catch (e) { if (!missing(e)) throw e; L = await rpc('admin_players', {p_search: '', p_limit: 1000}) }
    L = (L || []).filter(x => x.created_at).sort((a, b) => a.created_at < b.created_at ? 1 : -1);

    t.textContent = `🎉 Nouveau compte${fresh.length > 1 ? ` (${fresh.length})` : ''} : ${x.pseudo || 'joueur'}${x.num ? ' · ' + x.num : ''}${x.platform ? ' · ' + x.platform : ''}`;

const start0 = start; start = function () { start0(); $('#sonPay').hidden = false; payLabel(); clearInterval(payT); payCheck(); payT = setInterval(payCheck, 20000);

// 19/11 : alerte « base de comptes lente » (panne de la nuit du 18 au 19/11 : les joueurs s'en sont plaints avant qu'on le sache).
// Toutes les 30 s, le back pose une petite question à la base et mesure le temps de réponse. Plus de 2 s deux fois de suite, ou
// pas de réponse : bandeau rouge en haut de toutes les pages et son d'alerte (redit toutes les 5 minutes tant que ça dure).
const HL = {bad: 0, on: false, snd: 0, ms: 0, hist: []};
async function healthCheck() {
  if (!sess) return; const t0 = performance.now(); let ok = true;
  try { await Promise.race([rpc('is_admin'), new Promise((_, no) => setTimeout(() => no(new Error('délai')), 8000))]) } catch (e) { ok = false }
  const ms = performance.now() - t0;
  let auth = true; if (!ESSAI) try { const r = await fetch(CFG.url + '/auth/v1/health', {headers: {apikey: CFG.key}, signal: AbortSignal.timeout(8000)}); auth = r.ok } catch (e) { auth = false }
  HL.ms = ms; HL.auth = auth; HL.bad = !ok || ms > 2000 || !auth ? HL.bad + 1 : 0;
  HL.hist.push({t: Date.now(), ms, ok, auth}); if (HL.hist.length > 360) HL.hist.shift();
  healthShow(ok); hlNote(ok, ms) }
// journal des alertes (50 dernières, gardées dans ce navigateur)
const hlLog = () => { try { return JSON.parse(localStorage.getItem('coswars.alertesBase' + (ESSAI ? '.essai' : '')) || '[]') } catch (e) { return [] } };
function hlNote(ok, ms) { const L = hlLog(), cur = L.find(a => !a.fin);
  if (HL.on && !cur) L.push({debut: Date.now(), pire: ms, panne: !ok});
  else if (HL.on && cur) { cur.pire = Math.max(cur.pire || 0, ms); if (!ok) cur.panne = true }
  else if (!HL.on && cur) cur.fin = Date.now();
  try { localStorage.setItem('coswars.alertesBase' + (ESSAI ? '.essai' : ''), JSON.stringify(L.slice(-50))) } catch (e) {}
  const a = document.querySelector('#tabs a[data-k="bdd"]'); if (a) { a.style.background = HL.on ? '#7a0f1a' : ''; a.style.color = HL.on ? '#fff' : '' } }
function healthShow(ok) {
  let b = $('#health'); if (!b) { b = document.createElement('div'); b.id = 'health'; b.setAttribute('role', 'alert'); b.style.cssText = 'position:sticky;top:0;z-index:50;background:#7a0f1a;color:#fff;border:3px solid var(--ink);border-radius:12px;padding:10px 14px;margin:0 0 14px;font-weight:700;box-shadow:3px 3px 0 var(--ink)'; $('#view').before(b) }
  if (HL.bad >= 2) {
    b.innerHTML = `⚠️ ${!ok ? 'La base de comptes ne répond plus' : HL.auth === false ? 'Le service de connexion des comptes ne répond plus' : `La base de comptes est lente : ${(HL.ms / 1000).toFixed(1).replace('.', ',')} s pour répondre`}. Les joueurs risquent d’être bloqués (connexion, invitations, achats). <a href="#/bdd" style="color:#ffe9a0">Voir l’onglet Base de données</a>`;
    b.style.background = '#7a0f1a'; b.hidden = false; if (!HL.on || Date.now() - HL.snd > 300000) { HL.snd = Date.now(); for (let i = 0; i < 3; i++) setTimeout(() => { try { const c = new AudioContext(), o = c.createOscillator(), g = c.createGain(); o.type = 'square'; o.frequency.value = 330; g.gain.setValueAtTime(.18, c.currentTime); g.gain.exponentialRampToValueAtTime(.001, c.currentTime + .35); o.connect(g).connect(c.destination); o.start(); o.stop(c.currentTime + .35) } catch (e) {} }, i * 450) }
    HL.on = true }
  else if (HL.on && HL.bad === 0) { HL.on = false; b.innerHTML = '✅ La base de comptes répond de nouveau normalement.'; b.style.background = '#14532d'; setTimeout(() => { if (!HL.on) { b.hidden = true; b.style.background = '#7a0f1a' } }, 15000) }
  else if (!HL.on) b.hidden = true }
let hlT = 0; const start1 = start; start = function () { start1(); clearInterval(hlT); healthCheck(); hlT = setInterval(healthCheck, 30000) };

// Alertes des retours utilisateurs (19/11) : toutes les 20 s, le nombre de tickets qui méritent l'attention (pastille sur l'onglet).
// À chaque nouveau ticket (ou nouveau message) jugé « à regarder » depuis le dernier passage : son, bandeau cliquable et,
// si autorisée, notification du navigateur (visible même quand l'onglet du back est en arrière-plan). Le premier passage relève seulement.
const RET = {n: 0, f: 'attention', t: 0, on: localStorage.getItem('coswars.sonRetours') !== '0'}, RET_KEY = 'coswars.dernierRetour' + (ESSAI ? '.essai' : '');
const retBeep = () => { for (let i = 0; i < 2; i++) setTimeout(() => { try { const c = new AudioContext(), o = c.createOscillator(), g = c.createGain(); o.type = 'triangle'; o.frequency.value = i ? 784 : 587; g.gain.setValueAtTime(.25, c.currentTime); g.gain.exponentialRampToValueAtTime(.001, c.currentTime + .5); o.connect(g).connect(c.destination); o.start(); o.stop(c.currentTime + .5) } catch (e) {} }, i * 260) };
function retLabel() { $('#sonRet').textContent = RET.on ? '🔔 Alertes des retours' : '🔕 Retours : alertes coupées'; $('#sonRet').setAttribute('aria-pressed', RET.on) }
$('#sonRet').onclick = () => { RET.on = !RET.on; localStorage.setItem('coswars.sonRetours', RET.on ? '1' : '0'); retLabel(); if (RET.on) { retBeep(); try { if (window.Notification && Notification.permission === 'default') Notification.requestPermission() } catch (e) {} } };

  } catch (e) {} }

// Notifications (20/11) : un « 1 rouge » sur le bouton 🔔 Notifications en haut, pour chaque nouvel événement depuis le dernier
// clic : nouveau compte, nouvelle vente, nouveau retour utilisateur, nouvelle alerte (paiement signalé par le jeu, base de comptes
// lente), nouveau signalement, nouveau parrainage. Relevé toutes les 30 s. Un clic ouvre la liste (7 derniers jours, les nouveaux
// en surbrillance) et remet le compteur à zéro. La date du dernier clic est gardée dans ce navigateur.
const NT = {t: 0, L: [], f: '', open: false}, NT_KEY = 'coswars.notifVues' + (ESSAI ? '.essai' : '');
const NT_K = {acc: ['🎉', 'Nouveau compte'], sale: ['💶', 'Nouvelle vente'], end: ['🔻', 'Fin d’abonnement'], ret: ['📨', 'Retour utilisateur'], al: ['⚠️', 'Alerte'], rep: ['🚩', 'Signalement'], par: ['🤝', 'Parrainage']};
const ntSeen = () => localStorage.getItem(NT_KEY) || '';
const ntIso = v => v ? new Date(v).toISOString() : '';
async function ntFetch() {
  const since = Date.now() - 7 * 864e5, ok = v => v && +new Date(v) > since, E = [], tr = async f => { try { await f() } catch (e) {} };
  await Promise.all([
    tr(async () => { let L; try { L = await rpc('admin_accounts', {p_search: '', p_limit: 10000}) } catch (e) { if (!missing(e)) throw e; L = await rpc('admin_players', {p_search: '', p_limit: 1000}) }
      for (const x of L || []) if (ok(x.created_at)) E.push({k: 'acc', at: ntIso(x.created_at), t: `${x.pseudo || 'joueur'}${x.num ? ' · ' + x.num : ''}`, s: x.platform || '', h: x.id ? '#/fiche/' + x.id : '#/comptes'}) }),
    tr(async () => { let L; try { L = await rpc('admin_purchases', {p_days: 7, p_limit: 500}) } catch (e) { if (!missing(e)) throw e; L = (await rpc('admin_sales', {p_days: 7})).list || [] }
      for (const x of L || []) if (real(x) && PAY_BAD.includes(x.event) && ok(x.created_at)) E.push({k: 'end', at: ntIso(x.created_at), t: `${EV[x.event] || x.event} : ${x.pseudo || 'joueur'}${x.num ? ' · ' + x.num : ''} · ${x.product_name || String(x.product || '').replace('fr.coswars.jeu.', '')}`, s: STN[STORE(x.store)], h: '#/ventes', fl: payFlag(x)});
      for (const x of L || []) if (payGood(x) && ok(x.created_at)) E.push({k: 'sale', fl: payFlag(x), at: ntIso(x.created_at), t: `${x.pseudo || 'joueur'}${x.num ? ' · ' + x.num : ''} · ${x.product_name || String(x.product || '').replace('fr.coswars.jeu.', '')}`, s: `${STN[STORE(x.store)]}${x.price != null ? ' · ' + fmtCur(x.price, curOf(x)) : ''}${x.event === 'renouvellement' ? ' · renouvellement' : ''}`, h: '#/ventes'}) }),
    tr(async () => { const L = await rpc('admin_support_list', {p_filter: 'tous', p_limit: 300});
      for (const x of L || []) if (ok(x.last_at || x.created_at)) E.push({k: 'ret', at: ntIso(x.last_at || x.created_at), t: `${x.pseudo || x.from_name || x.from_email || 'inconnu'} : ${x.subject || '(sans sujet)'}`, s: x.summary || '', h: '#/retours/' + x.id}) }),
    tr(async () => { const L = await rpc('admin_pay_alerts', {p_days: 7});
      for (const x of L || []) if (ok(x.created_at) && x.stage !== 'refus-magasin') E.push({k: 'al', at: ntIso(x.created_at), t: `Paiement à vérifier : ${x.pseudo || 'joueur'}${x.num ? ' · ' + x.num : ''}`, s: `${String(x.product || '').replace('fr.coswars.jeu.', '')} · ${x.stage || ''}${x.done ? ' · traité' : ''}`, h: '#/livraisons'}) }),
    tr(async () => { for (const a of hlLog()) if (ok(a.debut)) E.push({k: 'al', at: ntIso(a.debut), t: a.panne ? 'La base de comptes ne répondait plus' : 'La base de comptes était lente', s: a.fin ? 'revenu à la normale' : 'en cours', h: '#/bdd'}) }),
    tr(async () => { const L = await rpc('admin_reports', {p_limit: 300});
      for (const x of L || []) if (ok(x.created_at)) E.push({k: 'rep', at: ntIso(x.created_at), t: `${x.reported_pseudo || 'joueur'}${x.reported_num ? ' · ' + x.reported_num : ''} signalé`, s: `${x.reason || ''}${x.mode ? ' · ' + x.mode : ''}`, h: '#/signalements'}) }),
    tr(async () => { const L = await rpc('admin_referrals', {p_limit: 500});
      for (const x of L || []) if (ok(x.created_at)) E.push({k: 'par', at: ntIso(x.created_at), t: `${x.sponsor_pseudo || '?'} a parrainé ${x.godchild_pseudo || '?'}`, s: `${x.sponsor_num || ''} → ${x.godchild_num || ''}`, h: '#/parrainages'}) })]);
  return E.sort((a, b) => a.at < b.at ? 1 : -1) }
// Pastilles rouges sur les onglets (20/11) : nombre de nouveautés de chaque sorte depuis le dernier clic sur l'onglet concerné
// (Comptes, Ventes, Retours utilisateurs, Alertes, Signalements, Parrainages). Seul un clic sur l'onglet lui-même les efface.
const NT_TAB = {acc: 'comptes', sale: 'ventes', end: 'ventes', ret: 'retours', al: 'alertes', rep: 'signalements', par: 'parrainages'};
const ntTabKey = k => 'coswars.notifOnglet.' + k + (ESSAI ? '.essai' : '');
function ntTabs() { const byTab = {}; for (const [k, tab] of Object.entries(NT_TAB)) (byTab[tab] = byTab[tab] || []).push(k);
  for (const [tab, ks] of Object.entries(byTab)) { const a = document.querySelector(`#tabs a[data-k="${tab}"]`); if (!a) continue;
    let n = 0; for (const k of ks) { let seen = localStorage.getItem(ntTabKey(k)); if (!seen) { seen = new Date().toISOString(); localStorage.setItem(ntTabKey(k), seen) } n += NT.L.filter(x => x.k === k && x.at > seen).length }
    let b = a.querySelector('.nbadge');
    if (!b) { b = document.createElement('b'); b.className = 'nbadge'; a.append(b);
      a.addEventListener('click', () => { for (const k of ks) localStorage.setItem(ntTabKey(k), new Date().toISOString()); b.hidden = true; a.removeAttribute('aria-description') }) }
    b.textContent = n > 99 ? '99+' : n; b.hidden = !n; if (n) a.setAttribute('aria-description', n + ' nouveau' + (n > 1 ? 'x' : '')); else a.removeAttribute('aria-description') } }
function ntBadge() { ntTabs(); const seen = ntSeen(), n = seen ? NT.L.filter(x => x.at > seen).length : 0, b = $('#notifN');
  b.textContent = n > 99 ? '99+' : n; b.hidden = !n; $('#notifBtn').setAttribute('aria-label', 'Notifications' + (n ? ', ' + n + ' nouvelle' + (n > 1 ? 's' : '') : '')) }
async function ntCheck() { try { NT.L = await ntFetch(); if (!ntSeen()) localStorage.setItem(NT_KEY, new Date().toISOString()); ntBadge(); if (NT.open) ntDraw() } catch (e) {} }
function ntDraw() { const P = $('#notifPanel'), seen = NT.seen0 || '', L = NT.L.filter(x => !NT.f || x.k === NT.f), cnt = k => NT.L.filter(x => x.k === k && x.at > seen).length;
  P.innerHTML = `<div class="row" style="justify-content:space-between;margin:0"><b style="font-size:18px">🔔 Notifications</b><button class="act sec" id="ntClose" aria-label="Fermer">✕</button></div>
    <div class="nf"><button class="act ${NT.f ? 'sec' : ''}" data-nf="">Tout</button>${Object.entries(NT_K).map(([k, [i, n]]) => `<button class="act ${NT.f === k ? '' : 'sec'}" data-nf="${k}">${i} ${n}${cnt(k) ? ` <b style="color:#ff6b7d">+${cnt(k)}</b>` : ''}</button>`).join('')}</div>
    ${L.length ? L.slice(0, 150).map(x => `<a class="nt ${x.at > seen ? 'new' : ''}" href="${x.h}"${x.k === 'end' ? ' style="border-left:5px solid #e5394f"' : x.k === 'sale' ? ' style="border-left:5px solid #2fc46b"' : ''}><span aria-hidden="true" style="font-size:20px">${NT_K[x.k][0]}</span><span style="flex:1"><b>${NT_K[x.k][1]}${x.at > seen ? ' · <span style="color:#ff6b7d">nouveau</span>' : ''}</b><br>${x.fl || ''}${esc(x.t)}${x.s ? `<br><span class="muted">${esc(x.s)}</span>` : ''}</span><span class="muted" style="white-space:nowrap;font-size:13px">${d(x.at)}</span></a>`).join('') : '<p class="muted">Rien ces 7 derniers jours.</p>'}`;
  $('#ntClose').onclick = ntClose; for (const b of P.querySelectorAll('[data-nf]')) b.onclick = () => { NT.f = b.dataset.nf; ntDraw() };
  for (const a of P.querySelectorAll('a.nt')) a.onclick = () => ntClose() }
function ntClose() { NT.open = false; $('#notifPanel').hidden = true; $('#notifBtn').setAttribute('aria-expanded', 'false') }
$('#notifBtn').onclick = async () => { if (NT.open) return ntClose();
  NT.open = true; NT.seen0 = ntSeen(); localStorage.setItem(NT_KEY, new Date().toISOString()); ntBadge();
  $('#notifPanel').hidden = false; $('#notifBtn').setAttribute('aria-expanded', 'true'); $('#notifPanel').innerHTML = '<p class="muted">Lecture…</p>';
  try { NT.L = await ntFetch() } catch (e) {} ntDraw(); ntBadge() };
addEventListener('keydown', e => { if (e.key === 'Escape' && NT.open) ntClose() });
const startN = start; start = function () { startN(); $('#notifBtn').hidden = false; clearInterval(NT.t); ntCheck(); NT.t = setInterval(ntCheck, 30000) };
if (sess) rpc('is_admin').then(ok => ok ? start() : logout()).catch(logout);
</script>
