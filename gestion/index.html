<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Coswars · gestion</title>
<link rel="icon" href="logo.png">
<style>
  /* Couleurs du jeu : bleu nuit, jaune Coswars, violet des cristaux, vert de la puissance, encre noire épaisse (façon Borderlands) */
  :root{--bg:#0b0624;--bg2:#140d33;--card:#1b1442;--card2:#271d57;--line:#3a2f78;--ink:#000;--txt:#f5f2ff;--sub:#c3bbe8;
    --y:#ffd23f;--cr:#c18bff;--pw:#7dff3a;--c:#35e0ff;--p:#ff5c8f;--ok:#7dff6a;--apple:#eef0f6;--google:#3ddc84;--stripe:#8a84ff}
  *{box-sizing:border-box}[hidden]{display:none!important}html{background:var(--bg)}
  body{margin:0;background:radial-gradient(1200px 700px at 50% -10%,#24185c 0,var(--bg) 60%) fixed;color:var(--txt);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
  a{color:var(--c)}:focus-visible{outline:3px solid var(--y);outline-offset:2px}
  .sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
  header{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:8px 16px;background:rgba(20,13,51,.96);border-bottom:4px solid var(--ink)}
  .home{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--y);font-weight:900;letter-spacing:.6px;font-size:18px}
  .home img{width:40px;height:40px;border-radius:11px;border:3px solid var(--ink);box-shadow:3px 3px 0 var(--ink)}
  nav.top{display:flex;gap:5px;flex-wrap:wrap}
  nav.top a{color:var(--txt);text-decoration:none;background:var(--card);border:2px solid var(--ink);border-radius:9px;padding:5px 10px;font-weight:700;font-size:13px;box-shadow:2px 2px 0 var(--ink)}
  nav.top a[aria-current=page]{background:var(--y);color:var(--ink)}
  header .who{margin-left:auto;color:var(--sub);font-size:13px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
  main{padding:18px 16px 60px;max-width:1500px;margin:0 auto}
  h1.page{margin:4px 0 14px;font-size:26px;color:var(--y);text-shadow:3px 3px 0 var(--ink)}
  .cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(175px,1fr));gap:12px;margin-bottom:18px}
  .card{background:var(--card);border:3px solid var(--ink);border-radius:14px;padding:11px 14px;box-shadow:4px 4px 0 var(--ink)}
  .card .v{font-size:25px;font-weight:900;color:var(--y);line-height:1.15}.card .l{color:var(--sub);font-size:13px}.card .s{font-size:12px;color:var(--sub)}
  .card.cr .v{color:var(--cr)}.card.pw .v{color:var(--pw)}.card.mo .v{color:var(--ok)}.card.ko .v{color:var(--p)}
  .box{background:var(--card);border:3px solid var(--ink);border-radius:14px;padding:14px;margin-bottom:16px;box-shadow:4px 4px 0 var(--ink);overflow:auto}
  .box h2{margin:0 0 10px;font-size:17px;color:var(--c)}.box h3{margin:12px 0 6px;font-size:14px;color:var(--y)}
  .box p.note{margin:6px 0 0;color:var(--sub);font-size:13px}
  table{border-collapse:collapse;width:100%;font-size:13px}th,td{padding:6px 8px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
  td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
  th{color:var(--sub);font-weight:700;position:sticky;top:0;background:var(--card);z-index:1}
  th button{all:unset;cursor:pointer;color:var(--sub);font-weight:700}th button:hover{color:var(--txt)}th[aria-sort] button{color:var(--y)}
  tr.click{cursor:pointer}tr.click:hover,tr.click:focus-within{background:var(--card2)}
  input,select{background:#0f0a2a;color:var(--txt);border:2px solid var(--line);border-radius:9px;padding:8px 10px;font:inherit}
  button.act,a.act{display:inline-block;background:var(--y);color:var(--ink);border:3px solid var(--ink);border-radius:10px;padding:7px 14px;font-weight:800;cursor:pointer;text-decoration:none;box-shadow:3px 3px 0 var(--ink);font:inherit;font-weight:800}
  button.sec,a.sec{background:var(--card2);color:var(--txt)}button.act:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink)}
  .row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
  .grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(360px,100%),1fr));gap:16px}
  .grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(280px,100%),1fr));gap:16px}
  .muted{color:var(--sub)}.ok{color:var(--ok)}.ko{color:var(--p)}.cry{color:var(--cr)}.pow{color:var(--pw)}
  .tag{display:inline-block;padding:1px 7px;border-radius:7px;background:#3a2f78;font-size:12px;margin:1px 3px 1px 0}
  .tag.test{background:#5b4a00;color:#ffe9a0}.tag.ref{background:#6b1030;color:#ffd0dd}.tag.adm{background:#00485a;color:#bff4ff}
  .st{display:inline-flex;align-items:center;gap:5px;padding:1px 8px 1px 6px;border-radius:999px;font-size:12px;font-weight:700;border:2px solid var(--ink);color:var(--ink)}
  .st::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--ink)}
  .st.apple{background:var(--apple)}.st.google{background:var(--google)}.st.stripe{background:var(--stripe)}.st.autre{background:#999}
  .dot{display:inline-block;width:10px;height:10px;border-radius:50%;background:#4a4170;border:2px solid var(--ink)}.dot.on{background:var(--ok);box-shadow:0 0 8px var(--ok)}
  #login{max-width:400px;margin:70px auto}#login .box{display:grid;gap:10px}#login img{width:96px;margin:0 auto;border-radius:22px;border:4px solid var(--ink);box-shadow:5px 5px 0 var(--ink)}
  pre{white-space:pre-wrap;word-break:break-word;font-size:12px;color:var(--sub);max-height:420px;overflow:auto}
  details summary{cursor:pointer;color:var(--c);font-weight:700}
  .bars{display:flex;align-items:flex-end;gap:3px;height:120px}.bars div{flex:1;background:var(--c);border-radius:3px 3px 0 0;min-height:2px;position:relative;border:1px solid var(--ink)}
  .bars.mo div{background:var(--ok)}.bars.cr div{background:var(--cr)}.bars.y div{background:var(--y)}
  .bars div:hover::after{content:attr(data-t);position:absolute;bottom:100%;left:50%;transform:translateX(-50%);background:#000;color:#fff;padding:3px 6px;border-radius:5px;font-size:11px;white-space:nowrap;z-index:2}
  .hb{display:grid;grid-template-columns:minmax(110px,auto) 1fr auto;gap:6px 10px;align-items:center;font-size:13px}
  .hb .t{height:14px;background:#0f0a2a;border:2px solid var(--ink);border-radius:7px;overflow:hidden}.hb .t i{display:block;height:100%;background:var(--c)}
  .split{display:flex;height:22px;border:3px solid var(--ink);border-radius:9px;overflow:hidden;margin:6px 0 10px}.split i{display:block;height:100%}
  #payToast{position:fixed;top:74px;right:20px;z-index:9;background:var(--ok);color:var(--ink);border:3px solid var(--ink);border-radius:14px;padding:14px 18px;font-weight:800;font-size:17px;box-shadow:6px 6px 0 var(--ink);max-width:440px}
  .room{border:2px solid var(--line);border-radius:12px;padding:10px;margin-bottom:10px}
  .net{display:block;font-size:11px;font-weight:700;color:var(--ok);line-height:1.3}.net.big{font-size:13px}.kpi .net.big{font-size:12px}
  /* Parties en direct (mode dieu) : carte vue de dessus */
  .god{display:grid;grid-template-columns:minmax(0,1fr) minmax(280px,380px);gap:16px}@media (max-width:980px){.god{grid-template-columns:1fr}}
  .god canvas{width:100%;aspect-ratio:1/1;max-height:calc(100vh - 170px);background:#07041a;border:3px solid var(--ink);border-radius:14px;box-shadow:4px 4px 0 var(--ink);display:block}
  .lg{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--sub);margin-top:8px}.lg i{display:inline-block;width:11px;height:11px;border-radius:50%;border:2px solid var(--ink);vertical-align:-1px;margin-right:4px}
  .lifebar{display:inline-flex;width:90px;height:9px;border:2px solid var(--ink);border-radius:5px;overflow:hidden;background:#0f0a2a;vertical-align:middle}.lifebar i{display:block;height:100%}
  .warn{background:#3d2a00;border:3px solid var(--ink);border-radius:12px;padding:9px 12px;margin-bottom:14px;color:#ffe9a0;font-size:13px;box-shadow:3px 3px 0 var(--ink)}

  /* ---- Cadran d'accueil : logo au centre, anneau des chiffres clés, cercle des sections ---- */
  .dial{--S:clamp(720px,min(94vw,calc(100vh - 80px)),920px);position:relative;width:var(--S);height:var(--S);margin:0 auto 26px}
  .dial .ring{position:absolute;left:50%;top:50%;border-radius:50%;transform:translate(-50%,-50%);pointer-events:none}
  .dial .r1{width:calc(var(--S)*.66);height:calc(var(--S)*.66);border:4px solid var(--ink);box-shadow:0 0 0 3px #2b2166 inset,0 0 60px #35e0ff22;background:radial-gradient(circle,#1d1450 0,#140d33 70%)}
  .dial .r2{width:calc(var(--S)*.97);height:calc(var(--S)*.97);border:3px dashed #3a2f78}
  .dial .r0{width:calc(var(--S)*.22);height:calc(var(--S)*.22);border:4px solid var(--ink);background:#0b0624;box-shadow:0 0 0 6px var(--y),0 0 0 10px var(--ink),0 0 50px #ffd23f55}
  .dial .logo{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:calc(var(--S)*.175);text-align:center;text-decoration:none}
  .dial .logo img{width:100%;border-radius:24%;display:block}
  .dial .logo b{display:block;position:absolute;left:50%;top:calc(100% + 18px);transform:translateX(-50%);color:var(--y);font-size:15px;letter-spacing:3px;text-shadow:2px 2px 0 var(--ink);white-space:nowrap}
  .dial .it{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%) rotate(var(--a)) translate(var(--r)) rotate(calc(-1*var(--a)))}
  .kpi{--r:calc(var(--S)*.225);width:calc(var(--S)*.155);text-align:center;background:var(--card);border:3px solid var(--ink);border-radius:16px;padding:8px 6px;box-shadow:4px 4px 0 var(--ink)}
  .kpi .v{font-size:21px;font-weight:900;line-height:1.1;color:var(--y);font-variant-numeric:tabular-nums}.kpi .l{font-size:12px;color:var(--sub);line-height:1.25}.kpi .s{font-size:11px;color:var(--sub)}
  .kpi.mo .v{color:var(--ok)}.kpi.on .v{color:var(--c)}.kpi.nw .v{color:var(--pw)}
  .osec{--r:calc(var(--S)*.405)}
  a.dbtn{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;width:calc(var(--S)*.15);min-height:96px;padding:8px 6px;text-align:center;text-decoration:none;color:var(--txt);
    background:var(--card2);border:3px solid var(--ink);border-radius:50%/40%;box-shadow:4px 4px 0 var(--ink);transition:transform .12s,background .12s;position:relative}
  a.dbtn:hover,a.dbtn:focus-visible{background:var(--y);color:var(--ink)}a.dbtn:hover .m,a.dbtn:focus-visible .m{color:#3a2a00}
  a.dbtn .i{font-size:26px;line-height:1}a.dbtn .t{font-weight:900;font-size:14px;line-height:1.15}a.dbtn .m{font-size:11px;color:var(--sub)}
  a.dbtn .badge{position:absolute;top:-6px;right:4px;background:var(--p);color:#fff;border:2px solid var(--ink);border-radius:999px;min-width:24px;padding:0 6px;font-weight:900;font-size:13px}
  .dial .live{position:absolute;left:50%;bottom:calc(var(--S)*.205);transform:translateX(-50%);font-size:11px;color:var(--sub);white-space:nowrap}
  @media (max-width:760px){
    .dial{width:auto;height:auto;display:grid;gap:12px}
    .dial .ring,.dial .live{display:none}.dial .logo{position:relative;left:auto;top:auto;transform:none;width:110px;margin:6px auto 30px}
    .dial .it{position:relative;left:auto;top:auto;transform:none}.dial .kgrid,.dial .sgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}
    .kpi{width:auto}a.dbtn{width:auto;border-radius:16px;min-height:84px}
  }
  @media (min-width:761px){.dial .kgrid,.dial .sgrid{display:contents}}
</style>
</head>
<body>
<header>
  <a class="home" href="#/" title="Revenir au cadran"><img src="logo.png" alt=""><span>COSWARS · gestion</span></a>
  <nav class="top" id="tabs" aria-label="Sections" hidden></nav>
  <span class="who" id="who"><button class="act sec" id="sonPay" hidden title="Son joué à chaque nouveau paiement">🔔 Son des paiements</button><button class="act sec" id="sonAcc" hidden title="Son joué à chaque nouveau compte créé">🔔 Son des nouveaux comptes</button><span id="whoTxt"></span></span>
</header>
<div id="payToast" role="status" aria-live="polite" hidden></div>
<main>
  <div id="login"><div class="box">
    <img src="logo.png" alt="Logo de Coswars">
    <h1 style="margin:0;color:var(--y);text-align:center">Connexion administrateur</h1>
    <p class="muted" id="srv"></p>
    <label class="sr" for="em">Adresse e-mail</label><input id="em" type="email" placeholder="Adresse e-mail du compte administrateur" autocomplete="username">
    <label class="sr" for="pw">Mot de passe</label><input id="pw" type="password" placeholder="Mot de passe" autocomplete="current-password">
    <button class="act" id="go">Se connecter</button>
    <button class="act sec" id="new">Première connexion : créer le compte</button>
    <p class="ko" id="err" role="alert"></p>
    <p class="muted">Seuls les comptes déclarés administrateur entrent (table <code>admins</code>, voir LISEZMOI.md).</p>
  </div></div>
  <div id="view" aria-live="polite"></div>
</main>
<script>
// Back de gestion de Coswars (2e version, 03/11) : un cadran d'accueil (logo, chiffres clés en direct, sections en cercle),
// les comptes, les parties, les cristaux, les ventes par magasin (Apple, Google Play, Stripe) et par devise, l'audience,
// les alertes, la boutique, les armes et le jeu en ligne en direct.
// Il lit la base Supabase du jeu par les fonctions admin_* (supabase/migrations), réservées aux comptes de la table admins :
// aucune clé secrète ici, seulement la clé publique du projet et votre connexion d'administrateur. Les fonctions de la
// migration 20261103150000_back_v2.sql (admin_dashboard, admin_accounts, admin_purchases) sont utilisées si elles existent ;
// sinon la page retombe sur les anciennes (admin_overview, admin_players, admin_sales).
// ?essai dans l'adresse : faux Supabase local (node tools/faux-supabase.mjs 54321 demo), pour essayer sans toucher au vrai serveur.
const ESSAI = location.search.includes('essai');
const CFG = ESSAI ? {url: 'http://127.0.0.1:54321', key: 'cle-publique'} : {url: 'https://wnsvuzndmcfywbkzrbob.supabase.co', key: 'sb_publishable_BlpLjTWM8D8OQQlkueVW5g_92vJdL7Y'};
const NET_JSON = location.protocol.startsWith('http') && !ESSAI ? '../net.json' : 'https://guillaumerouretravail-creator.github.io/coswars/net.json';
const $ = s => document.querySelector(s), esc = v => String(v ?? '').replace(/[&<>"]/g, c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;'}[c]));
const SP = {terrien: 'Terrien', venusien: 'Vénusien', draco: 'Draco', mentis: 'Mentis', arcturien: 'Arcturien'};
// modes enregistrés dans games.mode (src/engine : baseMatch({mode})) ; les trois derniers ne sont plus au menu
const MODES = {tourelle: 'Zone défensive', coal: 'Commando', evasion: 'Évasion', pred: 'Tireur d’élite (sniper)', predA: 'Tireur d’élite (assassin)',
  commander: 'Commandeur', tb: 'Bataille par équipe', arene: 'Arène des titans', surv: 'Tournoi des As (survie)', champ: 'Tournoi des As (championnat)'};
const OLD_MODES = {team: 'Bataille (ancienne)', duel: 'Duel de boss (ancien)', siege: 'Siège des titans (ancien)'};
const modeName = m => MODES[m] || OLD_MODES[m] || m;
// raisons réellement inscrites au registre des cristaux (fonctions des migrations)
const REASONS = {achat: 'Achat (pack payé)', carte: 'Carte (cristaux du jour)', remboursement: 'Remboursement', jeu: 'Jeu (gain ou dépense)', arme: 'Achat d’arme', parrainage: 'Parrainage', pseudo: 'Changement de pseudo', admin: 'Administrateur'};
const PLAT = {iphone: 'App iPhone', android: 'App Android', web: 'Navigateur (ordinateur)', telephone: 'Navigateur (téléphone)', mac: 'App Mac', '?': 'Inconnue'};
const PLAYM = {voix: 'À la voix (non-voyant)', malvoyant: 'Malvoyant', vue: 'À la vue', inconnu: 'Pas encore choisi'};
const EV = {achat: 'Achat', renouvellement: 'Renouvellement', remboursement: 'Remboursement', fin: 'Fin d’abonnement', 'arrêt': 'Renouvellement arrêté', reprise: 'Abonnement repris'};
// magasin d'origine de chaque paiement (purchases.store, transmis par RevenueCat)
const STORE = s => s === 'APP_STORE' || s === 'MAC_APP_STORE' ? 'apple' : s === 'PLAY_STORE' ? 'google' : s === 'STRIPE' || s === 'RC_BILLING' ? 'stripe' : 'autre';
const STN = {apple: 'Apple', google: 'Google Play', stripe: 'Stripe (web)', autre: 'Autre'}, STC = {apple: 'var(--apple)', google: 'var(--google)', stripe: 'var(--stripe)', autre: '#999'};
const stBadge = s => s ? `<span class="st ${STORE(s)}" title="${esc(s)}">${STN[STORE(s)]}</span>` : '<span class="muted">—</span>';
const d = v => v ? new Date(v).toLocaleString('fr-FR', {dateStyle: 'short', timeStyle: 'short', timeZone: 'Europe/Paris'}) : '—';
const dd = v => v ? new Date(v).toLocaleDateString('fr-FR', {timeZone: 'Europe/Paris'}) : '—';
const dur = s => s == null ? '—' : `${Math.floor(s / 60)} min ${String(Math.round(s % 60)).padStart(2, '0')}`;
const hours = s => !s ? '—' : s < 3600 ? Math.round(s / 60) + ' min' : (s / 3600).toFixed(1).replace('.', ',') + ' h';
const nb = v => (+v || 0).toLocaleString('fr-FR'), pct = (a, b) => b ? Math.round(a / b * 100) + ' %' : '—';
const ago = v => { if (!v) return '—'; const s = (Date.now() - new Date(v)) / 1000; return s < 90 ? 'à l’instant' : s < 3600 ? `il y a ${Math.round(s / 60)} min` : s < 86400 ? `il y a ${Math.round(s / 3600)} h` : `il y a ${Math.round(s / 86400)} j` };
// jours et mois de Paris (les « aujourd'hui » et « ce mois » de l'argent)
const PD = new Intl.DateTimeFormat('en-CA', {timeZone: 'Europe/Paris'}), dayKey = v => PD.format(new Date(v));
// ---- Argent (décisions du 03/11) : TOUT en euros, et à côté du brut le NET qui revient à MERLIN après la part du magasin ----
// Part gardée par chaque magasin : estimation validée par l'utilisateur, à changer ICI seulement (tout le back la lit).
//   pct = part du prix, fixe = frais fixes en euros par paiement, rend = commission rendue quand le magasin rembourse
//   (Apple et Google reprennent au vendeur sa part nette seulement ; Stripe garde ses frais).
const FEES = {apple: {pct: .15, fixe: 0, rend: true}, google: {pct: .15, fixe: 0, rend: true}, stripe: {pct: .015, fixe: .25, rend: false}, autre: {pct: 0, fixe: 0, rend: true}};
const feeTxt = () => `Apple ${FEES.apple.pct * 100} %, Google Play ${FEES.google.pct * 100} %, Stripe ${String(FEES.stripe.pct * 100).replace('.', ',')} % + ${String(FEES.stripe.fixe.toFixed(2)).replace('.', ',')} €`;
// Taux de change : devises pour 1 € (taux de référence de la BCE, publiés chaque jour ouvré, lus par frankfurter.dev : gratuit,
// sans clé), gardés 12 h dans ce navigateur. À défaut (hors ligne, site injoignable), ces taux fixes du 03/11/2026 :
const RATES0 = {date: '2026-11-03', src: 'taux fixes de secours (BCE du 03/11/2026)', r: {USD: 1.118, GBP: .8336, CHF: .9166, CAD: 1.562, AUD: 1.601, JPY: 176.9, CNY: 7.459, HKD: 8.771,
  SEK: 10.95, NOK: 10.32, DKK: 7.473, PLN: 4.419, CZK: 24.34, HUF: 364.4, RON: 5.343, TRY: 55.89, BRL: 6.141, MXN: 20.79, INR: 105.9, IDR: 20280, KRW: 1503, SGD: 1.432,
  THB: 37.73, PHP: 70.94, MYR: 4.558, NZD: 1.988, ZAR: 18.6, ILS: 3.529, ISK: 136.2}};
let RATES = RATES0; const UNK = new Set();   // devises sans taux connu (comptées 0, signalées)
async function loadRates() { const K = 'coswars.taux';
  try { const c = JSON.parse(localStorage.getItem(K) || 'null'); if (c && Date.now() - c.at < 12 * 3600e3 && c.r) { RATES = c; return } } catch (e) {}
  try { const ctl = new AbortController(), to = setTimeout(() => ctl.abort(), 5000), r = await fetch('https://api.frankfurter.dev/v1/latest?base=EUR', {signal: ctl.signal}); clearTimeout(to);
    const j = await r.json(); if (!j || !j.rates) throw 0; RATES = {date: j.date, src: 'BCE, lus sur frankfurter.dev', r: j.rates, at: Date.now()}; try { localStorage.setItem(K, JSON.stringify(RATES)) } catch (e) {} }
  catch (e) { try { const c = JSON.parse(localStorage.getItem(K) || 'null'); if (c && c.r) RATES = {...c, src: c.src + ', gardés dans ce navigateur'} } catch (e2) {} } }
const toEur = (v, c) => { c = String(c || 'EUR').toUpperCase(); if (c === 'EUR') return +v || 0; const t = RATES.r[c] || RATES0.r[c]; if (!t) { UNK.add(c); return 0 } return (+v || 0) / t };

// liste courte des paiements (cadran)
function miniPay(L) { return L.length ? `<table><tbody>${L.map(x => `<tr class="click" data-href="#/fiche/${esc(x.user_id)}"><td title="${d(x.created_at)}">${ago(x.created_at)}</td><td>${who(x.pseudo, '', x.user_id)}</td><td>${esc(x.product_name || x.product)}${real(x) ? '' : ' <span class="tag test">essai</span>'}</td><td>${stBadge(x.store)}</td>
  <td class="n ${x.event === 'remboursement' ? 'ko' : 'ok'}">${fmtPay(x)}</td></tr>`).join('')}</tbody></table>` : '<p class="muted">Aucun paiement pour l’instant.</p>' }
// barre partagée : part de chaque magasin dans l'argent réel (euros)
function storeSplit(L) { const o = {}, nt = {}; for (const x of L) if (real(x) && SALE(x.event)) { const e = eurRow(x), k = STORE(x.store); o[k] = (o[k] || 0) + e.b; nt[k] = (nt[k] || 0) + e.n } const T = Object.values(o).reduce((s, v) => s + v, 0);
  if (!T) return '<p class="muted">Pas encore de vente.</p>';
  return `<div class="split" role="img" aria-label="${Object.entries(o).map(([k, v]) => `${STN[k]} ${pct(v, T)}`).join(', ')}">${Object.entries(o).map(([k, v]) => `<i style="width:${v / T * 100}%;background:${STC[k]}" title="${STN[k]} : ${eur(v)}"></i>`).join('')}</div>
    <div class="hb">${Object.entries(o).sort((a, b) => b[1] - a[1]).map(([k, v]) => `<span><span class="st ${k}">${STN[k]}</span></span><span class="t"><i style="width:${v / T * 100}%;background:${STC[k]}"></i></span><span class="n">${eur(v)} · ${pct(v, T)} <span class="ok" style="display:block;font-size:11px">net ${eur(nt[k])}</span></span>`).join('')}</div>` }
function gamesTable(G, whoCol) { return `<table><thead><tr><th scope="col">Date</th>${whoCol ? '<th scope="col">Joueur</th>' : ''}<th scope="col">Mode</th><th scope="col">Résultat</th><th class="n" scope="col">Durée</th><th class="n" scope="col">Ennemis</th><th class="n" scope="col">Équipe</th><th class="n" scope="col">Boss</th><th class="n" scope="col">Bonus</th><th scope="col">Mission</th><th scope="col">Récompenses</th></tr></thead><tbody>
  ${G.map(g => { const L = g.rewards || {}, rw = [L.gold ? nb(L.gold) + ' cellules' : '', L.medals ? L.medals + ' cristaux' : '', L.fiber ? L.fiber + ' fibres' : '', ...Object.entries(L.comp || {}).filter(e => e[1]).map(([k, v]) => `${v} comp. ${k}`)].filter(Boolean).join(', ');
    return `<tr ${whoCol ? `class="click" data-href="#/fiche/${esc(g.user_id)}"` : ''}><td>${d(g.created_at)}</td>${whoCol ? `<td>${who(g.pseudo, g.num, g.user_id)}</td>` : ''}<td>${esc(modeName(g.mode))}${g.online ? ` <span class="tag">en ligne${g.room ? ' ' + esc(g.room) : ''}</span>` : ''}</td>
      <td class="${g.quit ? 'muted' : g.win ? 'ok' : 'ko'}">${g.quit ? 'quittée' : g.win ? 'victoire' : 'défaite'}</td><td class="n">${dur(g.duration)}</td><td class="n">${g.kills}</td><td class="n">${g.team_kills || ''}</td><td class="n">${g.bosses || ''}</td><td class="n">${g.bonus ? nb(g.bonus) : ''}</td><td>${esc(g.mission || '')}${g.stars != null && g.mission ? ' ' + '★'.repeat(g.stars) : ''}</td><td class="muted">${esc(rw)}</td></tr>` }).join('') || '<tr><td colspan="11" class="muted">Aucune partie.</td></tr>'}</tbody></table>` }
function ledgerTable(L, whoCol) { return `<table><thead><tr><th scope="col">Date</th>${whoCol ? '<th scope="col">Joueur</th>' : ''}<th class="n" scope="col">Mouvement</th><th scope="col">Raison</th><th scope="col">Référence</th></tr></thead><tbody>
  ${L.map(l => `<tr ${whoCol ? `class="click" data-href="#/fiche/${esc(l.user_id)}"` : ''}><td>${d(l.created_at)}</td>${whoCol ? `<td>${who(l.pseudo, l.num, l.user_id)}</td>` : ''}<td class="n ${l.delta < 0 ? 'ko' : 'cry'}">${l.delta > 0 ? '+' : ''}${nb(l.delta)}</td><td>${esc(REASONS[l.reason] || l.reason)}</td><td class="muted">${esc(l.ref)}</td></tr>`).join('') || '<tr><td colspan="5" class="muted">Aucun mouvement.</td></tr>'}</tbody></table>` }
// alertes : remboursements, soldes qui ne collent pas au registre, gros soldes, gains en jeu au-delà du plafond, gros parrains, dons d'administrateur
function alertList(D, P, N = {}) { const A = D && D.alerts, out = [], since = Date.now() - 90 * 864e5;
  const RF = (A && A.refunds) || P.filter(x => x.event === 'remboursement' && +new Date(x.created_at) > since);
  const pl = x => `<td>${who(x.pseudo, x.num, x.user_id)}</td>`;
  if (RF.length) out.push({t: 'Remboursements (90 jours)', why: 'Le magasin a remboursé le joueur ; les cristaux du pack sont repris dans la limite de son solde.', rows: RF,
    row: x => `<tr><td>${d(x.created_at)}</td>${pl(x)}<td>${esc(x.product_name || N[x.product] || x.product)}</td><td>${stBadge(x.store)}</td><td class="ko">${fmtPay({...x, event: 'remboursement'})}</td><td>${real(x) ? '' : '<span class="tag test">essai</span>'}</td></tr>`});
  if (!A) return out;
  if (A.wallet_mismatch.length) out.push({t: 'Solde différent du registre', why: 'Le porte-monnaie ne correspond pas à la somme des mouvements de cristaux (remboursement plafonné au solde, correction à la main dans la base…). À vérifier.', rows: A.wallet_mismatch,
    row: x => `<tr>${pl(x)}<td class="cry">solde ${nb(x.crystals)}</td><td>registre ${nb(x.ledger)}</td><td class="ko">écart ${x.crystals - x.ledger > 0 ? '+' : ''}${nb(x.crystals - x.ledger)}</td></tr>`});
  if (A.big_balance.length) out.push({t: 'Gros soldes de cristaux', why: '20 000 cristaux ou plus sur un compte qui n’est pas administrateur.', rows: A.big_balance, row: x => `<tr>${pl(x)}<td class="cry">${nb(x.crystals)} cristaux</td></tr>`});
  if (A.game_gains.length) out.push({t: 'Gains en jouant au-delà du plafond', why: 'Le serveur donne 30 cristaux par jour au plus en jouant : plus que cela un même jour est anormal.', rows: A.game_gains, row: x => `<tr>${pl(x)}<td>${esc(x.jour)}</td><td class="cry">+${nb(x.gains)}</td></tr>`});
  if (A.referrals.length) out.push({t: 'Parrains très actifs', why: 'Cinq filleuls ou plus : chaque parrainage donne 100 cristaux au parrain et 100 au filleul, sans limite (faille relevée par l’audit du 03/11).', rows: A.referrals, row: x => `<tr>${pl(x)}<td>${nb(x.filleuls)} filleuls</td><td>dernier ${d(x.dernier)}</td></tr>`});
  if (A.admin_grants.length) out.push({t: 'Cristaux donnés par un administrateur (30 jours)', why: 'Pour mémoire : chaque don ou retrait fait depuis une fiche joueur.', rows: A.admin_grants, row: x => `<tr><td>${d(x.created_at)}</td>${pl(x)}<td class="${x.delta < 0 ? 'ko' : 'cry'}">${x.delta > 0 ? '+' : ''}${nb(x.delta)}</td><td class="muted">${esc(x.ref)}</td></tr>`});
  return out }

// Son des paiements (03/11) : toutes les 20 s, les paiements des 2 derniers jours ; à chaque nouvel achat ou renouvellement réel
// (pas les essais sandbox), le son « Et voilà, on a les droits ! » (son/paiement.mp4) et un bandeau. Le premier passage
// ne fait que relever le dernier paiement connu (gardé sur cet ordinateur). Un navigateur ne joue un son qu'après un clic :
// le bouton « Son des paiements » sert aussi à l'autoriser et à l'essayer.
const PAY_KEY = 'coswars.dernierPaiement' + (ESSAI ? '.essai' : ''), paySnd = new Audio('son/paiement.mp4'); let payT = 0, payOn = localStorage.getItem('coswars.sonPaiement') !== '0';
const payBeep = () => { try { const c = new AudioContext(), o = c.createOscillator(), g = c.createGain(); o.frequency.value = 880; g.gain.setValueAtTime(.25, c.currentTime); g.gain.exponentialRampToValueAtTime(.001, c.currentTime + .6); o.connect(g).connect(c.destination); o.start(); o.stop(c.currentTime + .6) } catch (e) {} };
function payPlay() { if (!payOn) return; paySnd.currentTime = 0; paySnd.play().catch(payBeep) }
function payLabel() { $('#sonPay').textContent = payOn ? '🔔 Son des paiements' : '🔕 Son coupé'; $('#sonPay').setAttribute('aria-pressed', payOn) }
$('#sonPay').onclick = () => { payOn = !payOn; localStorage.setItem('coswars.sonPaiement', payOn ? '1' : '0'); payLabel(); if (payOn) payPlay() };
async function payCheck() {
  try { let L; try { L = await rpc('admin_purchases', {p_days: 2, p_limit: 200}) } catch (e) { if (!missing(e)) throw e; L = (await rpc('admin_sales', {p_days: 2})).list || [] }
    L = L.filter(x => SALE(x.event) && real(x));
    const last = localStorage.getItem(PAY_KEY), fresh = last ? L.filter(x => x.created_at > last) : [];
    if (L[0]) localStorage.setItem(PAY_KEY, L[0].created_at); else if (!last) localStorage.setItem(PAY_KEY, new Date().toISOString());
    if (!fresh.length) return;
    payPlay(); const x = fresh[0], t = $('#payToast');
    t.textContent = `💶 Nouveau paiement${fresh.length > 1 ? ` (${fresh.length})` : ''} : ${x.pseudo || 'joueur'}${x.num ? ' · ' + x.num : ''} · ${x.product_name || x.product.replace('fr.coswars.jeu.', '')} · ${STN[STORE(x.store)]} · ${x.price != null ? fmtCur(x.price, curOf(x)) + (curOf(x) !== 'EUR' ? ` (≈ ${eur(toEur(x.price, curOf(x)))})` : '') + ` · net ${eur(eurRow(x).n)}` : ''}`;
    t.hidden = false; clearTimeout(payCheck.h); payCheck.h = setTimeout(() => t.hidden = true, 12000);
    delete C.pur; delete C.acc; delete C.dash; if (page === 'ventes' || page === 'cadran') render() } catch (e) {} }
// Son des nouveaux comptes (06/11) : toutes les 20 s, la date de création du dernier compte ; à chaque compte créé depuis le
// dernier passage, le son son/nouveau-compte.mp4 (fichier fourni par l'utilisateur ; à défaut, deux bips) et un bandeau.
// Le premier passage ne fait que relever le dernier compte connu (gardé sur cet ordinateur).
const ACC_KEY = 'coswars.dernierCompte' + (ESSAI ? '.essai' : ''), accSnd = new Audio('son/nouveau-compte.mp4'); let accT = 0, accOn = localStorage.getItem('coswars.sonComptes') !== '0';
const accBeep = () => { payBeep(); setTimeout(payBeep, 220) };
function accPlay() { if (!accOn) return; accSnd.currentTime = 0; accSnd.play().catch(accBeep) }
function accLabel() { $('#sonAcc').textContent = accOn ? '🔔 Son des nouveaux comptes' : '🔕 Nouveaux comptes : son coupé'; $('#sonAcc').setAttribute('aria-pressed', accOn) }
$('#sonAcc').onclick = () => { accOn = !accOn; localStorage.setItem('coswars.sonComptes', accOn ? '1' : '0'); accLabel(); if (accOn) accPlay() };
async function accCheck() {
  try { let L; try { L = await rpc('admin_accounts', {p_search: '', p_limit: 10000}) } catch (e) { if (!missing(e)) throw e; L = await rpc('admin_players', {p_search: '', p_limit: 1000}) }
    L = (L || []).filter(x => x.created_at).sort((a, b) => a.created_at < b.created_at ? 1 : -1);
    const last = localStorage.getItem(ACC_KEY), fresh = last ? L.filter(x => x.created_at > last) : [];
    if (L[0]) localStorage.setItem(ACC_KEY, L[0].created_at); else if (!last) localStorage.setItem(ACC_KEY, new Date().toISOString());
    if (!fresh.length) return;
    accPlay(); const x = fresh[0], t = $('#payToast');
    t.textContent = `🎉 Nouveau compte${fresh.length > 1 ? ` (${fresh.length})` : ''} : ${x.pseudo || 'joueur'}${x.num ? ' · ' + x.num : ''}${x.platform ? ' · ' + x.platform : ''}`;
    t.hidden = false; clearTimeout(payCheck.h); payCheck.h = setTimeout(() => t.hidden = true, 12000);
    delete C.acc; delete C.dash; if (page === 'comptes' || page === 'cadran') render() } catch (e) {} }
const start0 = start; start = function () { start0(); $('#sonPay').hidden = false; payLabel(); clearInterval(payT); payCheck(); payT = setInterval(payCheck, 20000);
  $('#sonAcc').hidden = false; accLabel(); clearInterval(accT); accCheck(); accT = setInterval(accCheck, 20000) };
if (sess) rpc('is_admin').then(ok => ok ? start() : logout()).catch(logout);
</script>
</body>
