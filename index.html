<html lang="fr">

<meta name="mobile-web-app-capable" content="yes">

<link rel="icon" href="icon-180.png">

<!-- Coswars : fichier fabriqué par build.mjs à partir de src/ (npm run build). Ne pas le modifier à la main. -->
<title>Coswars</title>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
/* iPhone : pas de menu ni de loupe à l'appui long, pas de sélection de texte (consigne du 24/10) */
html,body,body *{-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}
/* Layout : menu en deux zones (commandement à gauche, modes de jeu à droite), combat en plein écran.
   Un seul univers visuel nocturne et saturé, assumé pour les deux thèmes. */
:root{
  --deep:#0d0826; --night:#170e3d; --card:#261b62; --card2:#33267f; --edge:#4c3bb0;
  --ink:#fff7e6; --soft:#c9bff4; --sun:#ffd23f; --cyan:#35e0ff; --pink:#ff4f8b; --lime:#7dff6a; --shadow:#07031a;
  --f-display:'Lilita One','Arial Black',Impact,system-ui,sans-serif;
  --f-title:'Bungee','Lilita One','Arial Black',Impact,sans-serif;
  --f-body:'Rubik',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  color-scheme:dark;
}
html,body{height:100%;touch-action:manipulation}/* pas de zoom au double toucher */
body{margin:0;background:var(--deep);color:var(--ink);font-family:var(--f-body);font-size:15px;overflow:hidden;-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
button{font:inherit;color:inherit}

/* ---------- Écran titre ---------- */
#splash{position:fixed;inset:0;border:0;margin:0;width:100%;display:grid;place-items:center;text-align:center;cursor:pointer;
  background:radial-gradient(120% 80% at 50% 110%,#ff4f8b55,transparent 60%),radial-gradient(90% 70% at 50% -10%,#35e0ff40,transparent 60%),linear-gradient(170deg,#2a1670,#120a36 65%,#0d0826);
  padding-block:24px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
#splash:focus-visible{outline:4px solid var(--sun);outline-offset:-8px}
.logo{font-family:var(--f-display);font-size:clamp(46px,11vw,120px);line-height:.9;letter-spacing:.01em;transform:skew(-7deg) rotate(-2deg);
  color:var(--sun);text-shadow:0 4px 0 #c2410c,0 8px 0 var(--shadow),0 0 40px #ffd23f66;margin:0}
.logo span{display:block;color:var(--ink);font-size:.55em;text-shadow:0 3px 0 var(--edge),0 6px 0 var(--shadow)}
.tagline{font-size:clamp(16px,2.4vw,21px);color:var(--soft);margin:18px auto 0;max-width:34ch;line-height:1.45}
.press{display:inline-block;margin-top:28px;font-family:var(--f-display);font-size:clamp(18px,3vw,26px);padding:14px 26px;border-radius:16px;background:var(--sun);color:#2a1206;box-shadow:0 5px 0 #b45309,0 10px 24px #0008;transform:skew(-6deg)}
.waves{position:relative;width:120px;height:120px;margin:0 auto 18px}
.waves i{position:absolute;inset:0;border:3px solid var(--cyan);border-radius:50%;opacity:0;animation:wave 2.4s ease-out infinite}
.waves i:nth-child(2){animation-delay:.8s}.waves i:nth-child(3){animation-delay:1.6s}
.waves b{position:absolute;inset:42px;border-radius:50%;background:var(--pink);box-shadow:0 0 24px var(--pink)}
@keyframes wave{0%{transform:scale(.3);opacity:.9}100%{transform:scale(1.25);opacity:0}}
@media (prefers-reduced-motion:reduce){.waves i{animation:none;opacity:.5}}

/* ---------- Menus ---------- */
#menu{position:fixed;inset:0;overflow:auto;padding-top:max(14px,env(safe-area-inset-top,0px));padding-bottom:max(18px,env(safe-area-inset-bottom,0px));
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  background:repeating-linear-gradient(115deg,#ffffff06 0 2px,transparent 2px 46px),radial-gradient(80% 60% at 85% 0%,#ff4f8b30,transparent 60%),radial-gradient(70% 60% at 0% 100%,#35e0ff26,transparent 60%),linear-gradient(165deg,#25136a,#130b3a 60%,#0d0826)}
#menu.explore{touch-action:none}
#menu.overlay{background:#0d0826e6}
.bar{display:flex;align-items:center;gap:14px;flex-wrap:wrap;max-width:1180px;margin:0 auto 10px}
.brand{font-family:var(--f-display);font-size:24px;color:var(--sun);transform:skew(-7deg);text-shadow:0 3px 0 var(--shadow)}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-left:auto}
.chip{font-size:13px;font-weight:700;padding:6px 11px;border-radius:999px;background:#0006;border:2px solid var(--edge);font-variant-numeric:tabular-nums}
.chip.gold{border-color:#b98a12;color:var(--sun)}
.head{max-width:1180px;margin:6px auto 14px}
.head h1{font-family:var(--f-display);font-weight:400;font-size:clamp(28px,4.4vw,42px);margin:0;letter-spacing:.01em;text-transform:uppercase;transform:skew(-6deg);transform-origin:left;text-shadow:0 4px 0 var(--shadow);text-wrap:balance}
.head p{margin:6px 0 0;color:var(--soft);max-width:70ch;line-height:1.5}
.zones{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:0;max-width:1180px;margin:0 auto}
/* deux moitiés égales séparées par une paroi verticale (document « les menus ») */
.zones:not(.single) #zl{padding-right:18px}.zones:not(.single) #zr{padding-left:18px;border-left:6px solid #0b0710;box-shadow:inset 3px 0 0 #35e0ff66}
.zones.single{grid-template-columns:minmax(0,1fr);max-width:760px}
.zone{display:flex;flex-direction:column;gap:10px;min-width:0}
.zone h2{font-family:var(--f-display);font-weight:400;font-size:14px;letter-spacing:.12em;text-transform:uppercase;color:var(--soft);margin:0 0 2px}
.item{position:relative;display:grid;grid-template-columns:auto 1fr;align-items:center;column-gap:12px;text-align:left;width:100%;min-height:58px;padding:12px 16px;
  border:3px solid var(--edge);border-radius:14px;background:linear-gradient(180deg,var(--card2),var(--card));box-shadow:0 4px 0 var(--shadow);cursor:pointer;transition:transform .12s,border-color .12s,box-shadow .12s}
.item .txt{grid-column:2;min-width:0;display:flex;flex-direction:column;gap:3px}
.item:not(:has(.badge)) .txt{grid-column:1 / span 2}
.lbl{font-family:var(--f-display);font-size:19px;letter-spacing:.01em;line-height:1.1}
.sub{font-size:13.5px;color:var(--soft);line-height:1.4}
.tag{position:absolute;top:-10px;right:12px;font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;padding:3px 9px;border-radius:999px;background:var(--mc,var(--sun));color:#1a0e2e;box-shadow:0 2px 0 var(--shadow)}
.badge{width:46px;height:46px;border-radius:12px;display:grid;place-items:center;background:var(--mc,var(--sun));transform:skew(-8deg);box-shadow:inset 0 -4px 0 #0003,0 3px 0 var(--shadow)}
.badge svg{width:28px;height:28px;fill:none;stroke:#1a0e2e;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round;transform:skew(8deg)}
.item.mode{min-height:74px}
.item.mode .lbl{font-size:21px}
.item:hover{border-color:#7a66e0}
.item.focus,.item:focus-visible{outline:none;border-color:var(--sun);box-shadow:0 0 0 4px #ffd23f55,0 4px 0 var(--shadow);transform:translateY(-2px)}
.item.locked{opacity:.55}
.item.back{background:transparent;border-style:dashed;min-height:48px}
.item.back .lbl{font-size:16px;color:var(--soft)}
.item.info{background:#0003}
#note{max-width:1180px;margin:16px auto 0;padding:14px 18px;border-radius:14px;background:#00000040;border:2px solid var(--edge);line-height:1.6;color:var(--ink)}
#note p{margin:0;max-width:72ch}
@media (max-width:760px){.zones{grid-template-columns:minmax(0,1fr)}.zones:not(.single) #zr{border-left:0;box-shadow:none;padding-left:0;margin-top:12px}.zones:not(.single) #zl{padding-right:0}.brand{font-size:20px}}
/* Téléphone tenu en portrait (ou verrouillé en portrait) : tout le jeu est tourné d'un quart de tour, on le tient à l'horizontale */
html.rot,html.rot body{overflow:hidden;height:100%}
html.rot body{position:fixed;left:0;top:0;margin:0;width:var(--rw);height:var(--rh);width:100dvh;height:100dvw;transform-origin:0 0;transform:translateX(var(--rh)) rotate(90deg);transform:translateX(100dvw) rotate(90deg)}
html.rot .zones:not(.single){grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
html.rot .zones:not(.single) #zr{border-left:6px solid #0b0710;box-shadow:inset 3px 0 0 #35e0ff66;padding-left:10px;margin-top:0}html.rot .zones:not(.single) #zl{padding-right:10px}
html.rot .logo{font-size:64px}html.rot .tagline{font-size:15px}
/* Téléphone à l'horizontale : menus compacts pour que tout tienne à l'écran */
html.phl #menu{padding-top:8px;padding-bottom:10px}
html.phl .bar{margin-bottom:4px}html.phl .brand{font-size:18px}html.phl .chip{font-size:11px;padding:3px 8px}
html.phl .head{margin:2px auto 8px}html.phl .head h1{font-size:22px}html.phl .head p{font-size:12.5px;line-height:1.35;margin-top:3px}
html.phl .zones{gap:0}html.phl .zones:not(.single) #zl{padding-right:10px}html.phl .zones:not(.single) #zr{padding-left:10px}html.phl .zone{gap:6px}html.phl .zone h2{font-size:11px}
#menu .item.big{min-height:112px;font-size:1.45em;padding:22px 28px;justify-content:center}#menu .item.big .lbl{font-size:2em}#menu .item.big .sub{font-size:1.1em}#menu .item.big.quit{box-shadow:inset 0 0 0 2px #ff4f8b,5px 5px 0 #0b0710}html.phl #menu .item.big{min-height:70px;font-size:1.2em}
html.phl .item{min-height:40px;padding:6px 11px;border-width:2px;border-radius:11px;column-gap:9px}
html.phl .item.mode{min-height:46px}html.phl .lbl,html.phl .item.mode .lbl{font-size:15px}html.phl .sub{font-size:11.5px;line-height:1.3}
html.phl .badge{width:32px;height:32px;border-radius:9px}html.phl .badge svg{width:20px;height:20px}
html.phl .portrait{width:46px;height:46px}html.phl .tag{font-size:9px;top:-8px;padding:2px 7px}
html.phl #note{margin-top:8px;padding:8px 12px;font-size:13px;line-height:1.4}
#scrollNav{position:fixed;right:max(8px,env(safe-area-inset-right,0px));bottom:max(10px,env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:10px;z-index:5}
#scrollNav[hidden]{display:none}
#scrollNav button{width:52px;height:52px;border-radius:50%;border:3px solid var(--sun);background:#0b0624e6;color:var(--sun);font-size:22px;line-height:1;box-shadow:0 4px 0 var(--shadow);cursor:pointer}
#scrollNav button:disabled{opacity:.25}

/* ---------- Combat ---------- */
#game{position:fixed;inset:0;background:#000;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
#cv{display:block;width:100%;height:100%}
#caption{position:absolute;left:50%;top:calc(env(safe-area-inset-top,0px) + 62px);transform:translateX(-50%);width:max-content;max-width:min(88vw,760px);text-align:center;pointer-events:none;display:flex;flex-direction:column;gap:4px;align-items:center}
#caption div{font-weight:700;font-size:clamp(15px,2.2vw,20px);padding:6px 14px;border-radius:10px;background:#0b0624c4;color:var(--ink);box-shadow:0 3px 0 #0006;transition:opacity .4s}
#caption div.p2{color:var(--sun)}#caption div.p3{color:#ff8fb1}
#pauseBtn{position:absolute;top:calc(env(safe-area-inset-top,0px) + 10px);left:50%;transform:translateX(-50%);width:46px;height:42px;border-radius:12px;border:2px solid #ffffff55;background:#0b0624b0;cursor:pointer}
#pauseBtn::before,#pauseBtn::after{content:"";position:absolute;top:11px;width:6px;height:18px;border-radius:2px;background:var(--ink)}
#pauseBtn::before{left:15px}#pauseBtn::after{right:15px}
.hint{position:absolute;bottom:calc(env(safe-area-inset-bottom,0px) + 38%);font-family:var(--f-display);font-size:15px;letter-spacing:.06em;color:#fff;opacity:.5;pointer-events:none;transition:opacity 1.2s;text-shadow:0 2px 0 #0008;text-align:center;width:50%}
.hint.l{left:0}.hint.r{right:0}
.hint.gone{opacity:0}

/* ---------- Univers COSWARS : 2050, la Terre au cœur d'une guerre spatiale ---------- */
:root{--deep:#04060f;--night:#0a1030;--card:#0f1a3e;--card2:#162660;--edge:#2b4fa8;--soft:#b6c6ef;--shadow:#01020a}
.starfield,#splash,#menu{background-color:var(--deep);
  background-image:radial-gradient(1px 1px at 12% 18%,#fff 60%,transparent),radial-gradient(1px 1px at 68% 8%,#cfe 60%,transparent),radial-gradient(1.5px 1.5px at 40% 62%,#fff 60%,transparent),
  radial-gradient(1px 1px at 84% 44%,#ffd 60%,transparent),radial-gradient(1px 1px at 22% 82%,#fff 60%,transparent),radial-gradient(1.5px 1.5px at 93% 88%,#bdf 60%,transparent),
  radial-gradient(1px 1px at 55% 30%,#fff 60%,transparent),radial-gradient(1px 1px at 4% 52%,#fff 60%,transparent),
  radial-gradient(60% 45% at 85% 110%,#ff5a3c55,transparent 70%),radial-gradient(55% 50% at 10% -10%,#3a6bff44,transparent 70%),linear-gradient(175deg,#0b1240,#060a22 55%,#04060f);
  background-size:260px 260px,260px 260px,260px 260px,260px 260px,260px 260px,260px 260px,260px 260px,260px 260px,100% 100%,100% 100%,100% 100%}
#menu.overlay{background:#04060fe8;z-index:60}/* le menu Pause passe devant la partie */
.logo{font-family:var(--f-display);letter-spacing:.06em;transform:skew(-6deg);color:#ffd23f;
  text-shadow:0 0 18px #ff8a3d99,0 4px 0 #b4370f,0 8px 0 var(--shadow),0 0 60px #35e0ff55}
.logo span{display:inline;color:#35e0ff;font-size:1em;text-shadow:0 0 18px #35e0ff99,0 4px 0 #134a8a,0 8px 0 var(--shadow)}
.year{font-family:var(--f-display);letter-spacing:.35em;text-transform:uppercase;color:#ff8a3d;margin:6px 0 0;font-size:clamp(14px,2vw,18px)}
.tagline{max-width:52ch}
.hint-ear{color:var(--soft);font-size:14px;margin:10px 0 0;opacity:.85}
.brand{color:#ffd23f;letter-spacing:.08em}
.planet{position:relative;width:150px;height:150px;margin:0 auto 14px;border-radius:50%;
  background:radial-gradient(circle at 35% 30%,#9fd8ff 0,#2f7be0 30%,#1b3f8f 58%,#0a1636 80%);box-shadow:inset -22px -14px 30px #01030cdd,0 0 50px #2f7be066}
.planet::after{content:"";position:absolute;inset:18% 22% 40% 18%;border-radius:50%;background:radial-gradient(circle,#3fbf6a99,transparent 70%);filter:blur(3px)}
.planet .ring{position:absolute;left:-30%;right:-30%;top:44%;height:14%;border-radius:50%;border:2px solid #ffd23f88;transform:rotate(-14deg)}
.planet .ship{position:absolute;width:16px;height:6px;background:#e8ecff;clip-path:polygon(0 50%,100% 0,80% 50%,100% 100%);animation:orbit 6s linear infinite}
.planet .s1{top:10%;left:-20%}.planet .s2{top:78%;left:110%;animation-duration:8s;animation-direction:reverse}
.planet .laser{position:absolute;height:2px;width:70px;background:linear-gradient(90deg,transparent,#ff4f8b,#fff);top:30%;left:-60%;animation:zap 2.6s ease-in infinite}
.planet .l2{top:65%;left:90%;background:linear-gradient(90deg,#fff,#35e0ff,transparent);animation-delay:1.3s}
@keyframes orbit{0%{transform:translate(0,0)}50%{transform:translate(120px,20px)}100%{transform:translate(0,0)}}
@keyframes zap{0%,70%{opacity:0;transform:translateX(0)}75%{opacity:1}100%{opacity:0;transform:translateX(160px)}}
@media (prefers-reduced-motion:reduce){.planet .ship,.planet .laser{animation:none}}
/* écran titre à l'horizontale sur téléphone : planète et logo réduits pour que le bouton reste visible */
html.phl #splash{padding-block:8px}html.phl .planet{width:76px;height:76px;margin-bottom:6px}html.phl .logo{font-size:48px}
html.phl .tagline{font-size:13px;margin-top:8px;max-width:60ch;line-height:1.35}html.phl .press{margin-top:12px;font-size:18px;padding:10px 20px}
.item{background:linear-gradient(180deg,var(--card2),var(--card));border-color:var(--edge)}
.item.focus,.item:focus-visible{border-color:#ffd23f;box-shadow:0 0 0 4px #ffd23f40,0 0 24px #35e0ff33,0 4px 0 var(--shadow)}
/* style comic (Borderlands) : cerné noir, ombre portée franche, titres encrés */
.item{border:3px solid #0b0710;box-shadow:inset 0 0 0 2px var(--edge),5px 5px 0 #0b0710}
.item.focus,.item:focus-visible{border-color:#0b0710;box-shadow:inset 0 0 0 3px #ffd23f,6px 6px 0 #0b0710,0 0 0 3px #ffd23f}
.head h1,.logo,.brand{-webkit-text-stroke:2px #0b0710;paint-order:stroke fill;text-shadow:4px 4px 0 #0b0710}
.badge,.tag,.chip,.press{border:2.5px solid #0b0710}.press{box-shadow:5px 5px 0 #0b0710}
/* charte du logo : lettres jaune → orange cernées de noir avec biseau magenta, liserés cyan */
.logoImg{margin:0 auto;line-height:0}.logoImg img{display:block;width:min(92vw,760px);height:auto;margin:0 auto;filter:drop-shadow(0 10px 22px #0008);user-select:none;-webkit-user-drag:none}
html.rot .logoImg img{width:min(92vh,560px)}html.phl .logoImg img{width:min(52vw,380px)}html.rot.phl .logoImg img{width:min(46vh,380px)}html.phl .hint-ear{display:none}html.phl .year{margin:2px 0}
.head h1,.brand,.press,.zone h2{font-family:var(--f-title);font-weight:400;letter-spacing:.02em}
.head h1,.brand{background:linear-gradient(180deg,#fff27a 0%,#ffd23f 38%,#ff9a1f 72%,#ff5a1f 100%);-webkit-background-clip:text;background-clip:text;color:transparent;
  -webkit-text-stroke:2.5px #0b0710;paint-order:stroke fill;text-shadow:none;filter:drop-shadow(3px 3px 0 #e8246b) drop-shadow(3px 3px 0 #0b0710)}
.head h1{transform:skew(-6deg) rotate(-1deg)}
.zone h2{color:#35e0ff;font-size:13px;text-shadow:2px 2px 0 #0b0710}
.press{background:linear-gradient(180deg,#ffe45a,#ff9a1f);color:#1a0b05;box-shadow:inset 0 -4px 0 #e8246b,5px 5px 0 #0b0710}
.item{background:linear-gradient(180deg,#1c2554,#111637);box-shadow:inset 0 0 0 2px #2fb8e0aa,5px 5px 0 #0b0710}
.item::before{content:"";position:absolute;left:10px;right:10px;top:-3px;height:3px;background:linear-gradient(90deg,transparent,#35e0ff,transparent);opacity:.7}
.item.focus,.item:focus-visible{background:linear-gradient(180deg,#2a2466,#1a1340);box-shadow:inset 0 0 0 3px #ffd23f,6px 6px 0 #e8246b,9px 9px 0 #0b0710}
.item.focus .lbl{color:#ffd23f}
.chip{background:#0b0710cc}.chip.gold{color:#ffd23f}
#scrollNav button{border-color:#0b0710;background:linear-gradient(180deg,#ffe45a,#ff9a1f);color:#1a0b05;box-shadow:inset 0 -3px 0 #e8246b,4px 4px 0 #0b0710}
.item.species .lbl{font-size:21px}
.portrait{grid-row:1/span 2;width:72px;height:72px;border-radius:14px;background:#0a1030 center/cover no-repeat;border:2px solid var(--edge);box-shadow:0 3px 0 var(--shadow)}
.item:has(.portrait){grid-template-columns:auto 1fr}.item:has(.portrait) .txt{grid-column:2}

/* téléphone à l'horizontale (ou écran tourné) : le menu principal garde ses deux colonnes côte à côte */
html.phl .zones:not(.single),html.rot .zones:not(.single){grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
html.phl .zones:not(.single) #zr{border-left:6px solid #0b0710;box-shadow:inset 3px 0 0 #35e0ff66;margin-top:0}
</style>

<div id="live" class="sr" aria-live="polite"></div>
<div id="liveA" class="sr" aria-live="assertive"></div>

<button id="splash" type="button" aria-label="Coswars. Cliquez sur une touche pour continuer.">
  <div>
    <h1 class="logoImg"><img src="images/logo.png" alt="Coswars. L’avenir du système solaire est entre vos mains." draggable="false"></h1>
    <p class="year">Terre · 2050</p>
    <p class="tagline">Le secret a été trahi : la guerre spatiale autour de la planète ne pouvait plus passer pour des comètes. Armée en urgence par les Vénusiens, la Terre entre dans la guerre des étoiles.</p>
    <p class="hint-ear">Jeu de tir à la première personne qui se joue à l’oreille. Casque conseillé.</p>
    <span class="press">Cliquez sur une touche pour continuer</span>
  </div>
</button>

<div id="menu" hidden>
  <div class="bar">
    <div class="brand" aria-hidden="true">COSWARS</div>
    <div class="chips" id="chips" aria-hidden="true"></div>
